name: BTC ETH Research Warehouse V2
# RESEARCH_WAREHOUSE_VERSION: 2026-10-23-v2
# Does not modify the original market_database.yml or original SQLite artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-eth-market-warehouse-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch complete source archive
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build independently validated historical research SQLite
        id: build_database
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/build_market_v2.py <<'PY_MARKET_V2'
          #!/usr/bin/env python3
          """Build a research warehouse from immutable UTC-day BTC/ETH archives.
          
          The original database is unchanged. This produces a new v2 SQLite artifact,
          adding historical Binance OI and actual funding settlement events with
          point-in-time (PIT) guards. An assumed delay guard is NOT observed publication.
          """
          import bisect
          import gzip
          import hashlib
          import json
          import math
          import os
          import re
          import sqlite3
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          
          ROOT = Path(os.getenv('MARKET_ARCHIVE_ROOT', 'data/market_archive'))
          WAREHOUSE = Path(os.getenv('MARKET_WAREHOUSE_DIR', 'data/warehouse'))
          DATABASE = WAREHOUSE / 'btc_eth_market_v2.sqlite'
          MANIFEST = Path(os.getenv('MARKET_MANIFEST_PATH', 'data/warehouse_manifest_v2.json'))
          SYMBOLS = ('BTC','ETH')
          PERIODS = {'spot_5m':300,'futures_5m':300,'oi_15m':900,
                     'liquidations_15m':900,'liquidations_1h':3600,'funding_1h':3600}
          FIELDS = {
              'spot_5m':('o','h','l','c','v_base','v_quote_usdt','buy_base','buy_quote_usdt','sell_quote_usdt'),
              'futures_5m':('o','h','l','c','v_native','buy_native','sell_native'),
              'oi_15m':('o','h','l','c'),
              'liquidations_15m':('long_usd','short_usd'),
              'liquidations_1h':('long_usd','short_usd'),
              'funding_1h':('o','h','l','c'),
              'binance_oi_5m':('native','notional_usdt','raw_label_t'),
              'binance_funding_settlements':('rate_decimal',),
          }
          # 5 minutes after raw observation/event timestamp: conservative hypothetical guard.
          GUARD = 300
          PROVIDER_MAX_LAG = 7200
          ACTUAL_FUNDING_MAX_AGE = 48*3600
          
          
          def utc(t):
              return datetime.fromtimestamp(t,timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          
          
          def validate(series, value, sym, day):
              if not isinstance(value, dict):raise ValueError('row not mapping')
              t=value.get('t')
              if type(t) is not int or t<0:raise ValueError('bad timestamp')
              if datetime.fromtimestamp(t,timezone.utc).strftime('%Y-%m-%d') != day:
                  raise ValueError('timestamp outside named day')
              if series in PERIODS and t%PERIODS[series]:raise ValueError('bucket misaligned')
              if series=='binance_oi_5m' and t%300:raise ValueError('OI observation misaligned')
              out={'t':t}
              for k in FIELDS[series]:
                  v=value.get(k)
                  if type(v) not in (int,float) or not math.isfinite(v):
                      raise ValueError(f'invalid {series}.{k}')
                  out[k]=v
              if series=='binance_funding_settlements':
                  rate=float(out['rate_decimal'])
                  if abs(rate)>1:raise ValueError('funding rate implausible')
                  h=value.get('interval_hours')
                  if h is not None and (type(h) not in (int,float) or not math.isfinite(h) or h<0):
                      raise ValueError('funding interval invalid')
                  out['interval_hours']=float(h) if h is not None else None
              if series=='binance_oi_5m':
                  if out['native']<=0 or out['notional_usdt']<=0:raise ValueError('nonpositive Binance OI')
                  label=value.get('label_convention')
                  if label not in ('start_plus_5m','end_at_T'):raise ValueError('unrecognized OI label convention')
                  # Historical OI observation timestamp should normalize to end of the 5m sample.
                  if (label=='start_plus_5m' and t-out['raw_label_t']!=300) or (label=='end_at_T' and t!=out['raw_label_t']):
                      raise ValueError('OI raw/normalized time mismatch')
                  out['label_convention']=label
              if series=='futures_5m':
                  if abs(out['buy_native']+out['sell_native']-out['v_native'])>max(2e-5,out['v_native']*1e-5):
                      raise ValueError('futures volume mismatch')
              if series=='spot_5m':
                  if out['buy_base']>out['v_base']*(1+1e-5):raise ValueError('spot buy>total')
                  if abs(out['sell_quote_usdt']-(out['v_quote_usdt']-out['buy_quote_usdt']))>max(.01,out['v_quote_usdt']*1e-6):
                      raise ValueError('spot taker quote mismatch')
              if series in ('futures_5m','spot_5m'):
                  if out['h']<max(out['o'],out['l'],out['c']) or out['l']>min(out['o'],out['h'],out['c']):
                      raise ValueError('invalid OHLC')
              if series.startswith('liquidations_') and (out['long_usd']<0 or out['short_usd']<0):
                  raise ValueError('negative liquidation')
              if series=='oi_15m' and any(out[k]<0 for k in ('o','h','l','c')):
                  raise ValueError('negative provider OI')
              return out
          
          
          def collect():
              slots={s:{key:{} for key in FIELDS} for s in SYMBOLS}
              paths=sorted(ROOT.glob('????-??-??/*.json.gz'))
              if not paths:raise ValueError('no historical archives')
              digest=hashlib.sha256(); source_files=0
              for path in paths:
                  sym=path.stem.split('.')[0]; day=path.parent.name
                  if sym not in SYMBOLS or not re.fullmatch(r'\d{4}-\d{2}-\d{2}',day):continue
                  payload=path.read_bytes()
                  doc=json.loads(gzip.decompress(payload))
                  if doc.get('schema_version')!=1 or doc.get('symbol')!=sym or doc.get('utc_day')!=day:
                      raise ValueError(f'invalid archive header {path}')
                  src=doc.get('series')
                  if not isinstance(src,dict):raise ValueError(f'missing archive series {path}')
                  for key in FIELDS:
                      items=src.get(key,[])
                      if not isinstance(items,list):raise ValueError(f'{path}: invalid {key} array')
                      for item in items:
                          row=validate(key,item,sym,day)
                          old=slots[sym][key].get(row['t'])
                          if old is not None and old!=row:raise ValueError(f'conflict {sym}/{key}/{row["t"]}')
                          slots[sym][key][row['t']]=row
                  digest.update(str(path).encode()+b'\0'+hashlib.sha256(payload).digest())
                  source_files+=1
              for sym in SYMBOLS:
                  for required in ('spot_5m','futures_5m','binance_oi_5m','binance_funding_settlements'):
                      if not slots[sym][required]:raise ValueError(f'{sym}: missing {required}')
              return slots,source_files,digest.hexdigest()
          
          
          def coverage(table,step=None):
              keys=sorted(table)
              if not keys:return {'observed':0,'first_utc':None,'last_utc':None,'missing_in_span':None}
              result={'observed':len(keys),'first_utc':utc(keys[0]),'last_utc':utc(keys[-1])}
              if step:
                  expected=(keys[-1]-keys[0])//step+1
                  result.update({'expected_in_observed_span':expected,'missing_in_span':expected-len(keys),
                                 'coverage_pct':round(100*len(keys)/expected,4)})
              return result
          
          
          def build(store,created):
              WAREHOUSE.mkdir(parents=True,exist_ok=True)
              if DATABASE.exists():DATABASE.unlink()
              conn=sqlite3.connect(DATABASE)
              try:
                  conn.execute('PRAGMA journal_mode=DELETE')
                  conn.execute('PRAGMA synchronous=FULL')
                  conn.execute('CREATE TABLE metadata(key TEXT PRIMARY KEY, value TEXT NOT NULL)')
                  conn.executemany('INSERT INTO metadata VALUES (?,?)',[
                      ('schema_version','2'),('built_utc',utc(created)),
                      ('point_in_time_caution','5 minute guard is an assumption, not verified archival publication time'),
                      ('binance_oi_basis','5m end-of-interval OI observation; 5-minute assumed availability guard'),
                      ('actual_funding_basis','Binance actual settlement event; separate from Coinalyze funding_1h OHLC')])
                  conn.executescript('''
                    CREATE TABLE spot_5m(symbol TEXT,t INTEGER,o REAL,h REAL,l REAL,c REAL,v_base REAL,v_quote_usdt REAL,buy_base REAL,buy_quote_usdt REAL,sell_quote_usdt REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE futures_5m(symbol TEXT,t INTEGER,o REAL,h REAL,l REAL,c REAL,v_native REAL,buy_native REAL,sell_native REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE oi_15m(symbol TEXT,t INTEGER,o REAL,h REAL,l REAL,c REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE liquidations_15m(symbol TEXT,t INTEGER,long_usd REAL,short_usd REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE liquidations_1h(symbol TEXT,t INTEGER,long_usd REAL,short_usd REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE funding_1h(symbol TEXT,t INTEGER,o REAL,h REAL,l REAL,c REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE binance_oi_5m(symbol TEXT,t INTEGER,native REAL NOT NULL,notional_usdt REAL NOT NULL,raw_label_t INTEGER NOT NULL,label_convention TEXT NOT NULL,PRIMARY KEY(symbol,t));
                    CREATE TABLE binance_funding_settlements(symbol TEXT,t INTEGER,rate_decimal REAL NOT NULL,interval_hours REAL,PRIMARY KEY(symbol,t));
                    CREATE TABLE research_5m(
                      symbol TEXT NOT NULL,t INTEGER NOT NULL,end_t INTEGER NOT NULL,
                      spot_open REAL,spot_close REAL,future_open REAL,future_close REAL,
                      spot_taker_delta_quote_usdt REAL,futures_taker_delta_native REAL,
                      oi_native REAL,oi_asof_end_t INTEGER,oi_lag_seconds INTEGER,
                      last_hour_long_liquidations_usd REAL,last_hour_short_liquidations_usd REAL,
                      liq_asof_end_t INTEGER,liq_lag_seconds INTEGER,
                      funding_provider_rate_close REAL,funding_asof_end_t INTEGER,funding_lag_seconds INTEGER,
                      binance_oi_native REAL,binance_oi_notional_usdt REAL,binance_oi_observed_t INTEGER,binance_oi_lag_seconds INTEGER,
                      last_actual_funding_rate_decimal REAL,last_actual_funding_settlement_t INTEGER,
                      actual_funding_age_seconds INTEGER,
                      PRIMARY KEY(symbol,t));
                    CREATE INDEX research_end_idx ON research_5m(symbol,end_t);
                  ''')
                  for sym in SYMBOLS:
                      for key,fields in FIELDS.items():
                          allfields=('symbol','t')+fields+(('label_convention',) if key=='binance_oi_5m' else ('interval_hours',) if key=='binance_funding_settlements' else ())
                          sql=f'INSERT INTO {key}('+','.join(allfields)+') VALUES ('+','.join('?' for _ in allfields)+')'
                          rows=[(sym,t)+tuple(r[f] for f in allfields[2:]) for t,r in sorted(store[sym][key].items())]
                          conn.executemany(sql,rows)
                      spot=store[sym]['spot_5m']; futures=store[sym]['futures_5m']
                      oi=store[sym]['oi_15m']; co_liq=store[sym]['liquidations_1h']; co_fund=store[sym]['funding_1h']
                      bin_oi=store[sym]['binance_oi_5m']; settled=store[sym]['binance_funding_settlements']
                      old_series=[(oi,sorted(oi),900),(co_liq,sorted(co_liq),3600),(co_fund,sorted(co_fund),3600)]
                      bin_keys=sorted(bin_oi); funding_keys=sorted(settled)
                      output=[]
                      for t,sp in sorted(spot.items()):
                          fu=futures.get(t)
                          if fu is None:continue
                          end=t+300
                          # Prior Coinalyze buckets: interval must end + guard <= decision candle close.
                          prior=[]
                          for data,keys,width in old_series:
                              idx=bisect.bisect_right(keys,end-width-GUARD)-1
                              if idx<0:prior.append((None,None,None));continue
                              x=keys[idx];last_end=x+width;lag=end-last_end
                              prior.append((data[x],last_end,lag) if GUARD<=lag<=PROVIDER_MAX_LAG else (None,None,None))
                          (coi,coi_end,coi_lag),(liq,liq_end,liq_lag),(cf,cf_end,cf_lag)=prior
                          # For Binance 5m OI require precisely one previous observation,
                          # avoiding carry-forward across any known missing/invalid OI point.
                          oi_cutoff=end-GUARD
                          bo=bin_oi.get(oi_cutoff)
                          # Keep settlement events distinct; no interpolation of rates.
                          si=bisect.bisect_right(funding_keys,end-GUARD)-1
                          if si>=0 and end-funding_keys[si]<=ACTUAL_FUNDING_MAX_AGE:
                              st=funding_keys[si];br=settled[st];br_age=end-st
                          else:st=br=br_age=None
                          output.append((sym,t,end,sp['o'],sp['c'],fu['o'],fu['c'],
                              sp['buy_quote_usdt']-sp['sell_quote_usdt'],fu['buy_native']-fu['sell_native'],
                              coi['c'] if coi else None,coi_end,coi_lag,
                              liq['long_usd'] if liq else None,liq['short_usd'] if liq else None,liq_end,liq_lag,
                              cf['c'] if cf else None,cf_end,cf_lag,
                              bo['native'] if bo else None,bo['notional_usdt'] if bo else None,bo['t'] if bo else None,
                              end-bo['t'] if bo else None,
                              br['rate_decimal'] if br else None,st,br_age))
                      conn.executemany('INSERT INTO research_5m VALUES ('+','.join('?' for _ in range(26))+')',output)
                  conn.commit()
                  check=conn.execute('PRAGMA integrity_check').fetchone()[0]
                  if check!='ok':raise ValueError('SQLite integrity check: '+check)
                  # Audit unknown-future timestamps and gap treatment.
                  bad=conn.execute('''SELECT count(*) FROM research_5m
                    WHERE (binance_oi_observed_t IS NOT NULL AND binance_oi_observed_t+? > end_t)
                    OR (last_actual_funding_settlement_t IS NOT NULL AND last_actual_funding_settlement_t+? > end_t)
                    OR (oi_asof_end_t IS NOT NULL AND oi_asof_end_t+? > end_t)
                    OR (funding_asof_end_t IS NOT NULL AND funding_asof_end_t+? > end_t)
                    OR (liq_asof_end_t IS NOT NULL AND liq_asof_end_t+? > end_t)
                    OR (binance_oi_observed_t IS NOT NULL AND end_t-binance_oi_observed_t != ?)''',
                    (GUARD,GUARD,GUARD,GUARD,GUARD,GUARD)).fetchone()[0]
                  if bad:raise ValueError(f'future-leak / stale OI violations: {bad}')
                  counters={}
                  for sym in SYMBOLS:
                      counts={name:conn.execute(f'SELECT count(*) FROM {name} WHERE symbol=?',(sym,)).fetchone()[0]
                              for name in list(FIELDS)+['research_5m']}
                      counts['research_5m_with_binance_oi']=conn.execute('SELECT count(*) FROM research_5m WHERE symbol=? AND binance_oi_native IS NOT NULL',(sym,)).fetchone()[0]
                      counts['research_5m_with_actual_funding']=conn.execute('SELECT count(*) FROM research_5m WHERE symbol=? AND last_actual_funding_rate_decimal IS NOT NULL',(sym,)).fetchone()[0]
                      counters[sym]=counts
                  return counters
              finally:
                  conn.close()
          
          
          def main():
              now=int(datetime.now(timezone.utc).timestamp())
              result={'generated_utc':utc(now),'schema_version':2,'status':'unverified',
                  'database_export':'GitHub Actions artifact btc-eth-market-research-v2, 30 day retention',
                  'guard_seconds':GUARD,'guard_warning':'Historical timestamp assumed available after +5m. This is not independently measured: verify archived release timings before trusting trading signals.',
                  'missingness_policy':'Missing Binance OI stays NULL. Never carry forward missing 5m OI, and do not substitute Coinalyze OI; actual funding stays separate from provider estimate.',
                  'source_time_semantics':'Binance OI t is observation end; Binance funding t is settlement event time; research row end_t is decision-candle close.',
                  'backtest_limit':'No historical liquidation orderbook reconstruction; exchange corrections and vendor publication lag not independently audited.'}
              try:
                  data,files,digest=collect()
                  result['source_files']=files;result['source_sha256']=digest
                  result['coverage']={sym:{key:coverage(data[sym][key],300 if key in ('spot_5m','futures_5m','binance_oi_5m') else None)
                                            for key in FIELDS} for sym in SYMBOLS}
                  counts=build(data,now)
                  result['table_counts']=counts
                  for sym in SYMBOLS:
                      for key in ('spot_5m','futures_5m'):
                          if result['coverage'][sym][key]['missing_in_span']!=0:
                              raise ValueError(f'core gap {sym}/{key}')
                  result['sqlite_bytes']=DATABASE.stat().st_size
                  result['sqlite_sha256']=hashlib.sha256(DATABASE.read_bytes()).hexdigest()
                  result['status']='ready_with_source_gaps' if any(result['coverage'][sym]['binance_oi_5m'].get('missing_in_span',0)>0 for sym in SYMBOLS) else 'ready'
              except Exception as ex:
                  result['status']='failed';result['error']=f'{type(ex).__name__}: {str(ex)[:500]}'
              MANIFEST.parent.mkdir(parents=True,exist_ok=True)
              MANIFEST.write_text(json.dumps(result,ensure_ascii=False,indent=2,allow_nan=False)+'\n',encoding='utf8')
              print('RESEARCH V2',result['status'], json.dumps({k:result.get(k) for k in ('table_counts','error','sqlite_bytes')},ensure_ascii=False))
              return 1 if result['status']=='failed' else 0
          
          if __name__=='__main__':sys.exit(main())
          PY_MARKET_V2
          python /tmp/build_market_v2.py
      - name: Upload SQLite research database
        if: steps.build_database.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-market-research-v2
          path: data/warehouse/btc_eth_market_v2.sqlite
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
      - name: Preserve validation manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/warehouse_manifest_v2.json ]; then
            echo "Market research v2 manifest was not produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/warehouse_manifest_v2.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "Validate historical BTC ETH OI and funding research warehouse v2"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Market warehouse v2 manifest committed"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Fail if source validation failed
        if: steps.build_database.outcome == 'failure'
        shell: bash
        run: |
          echo "Research v2 quality verification failed; inspect data/warehouse_manifest_v2.json and job output"
          exit 1
