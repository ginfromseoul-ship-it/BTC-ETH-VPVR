
name: BTC ETH Market Flow 15min

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: market-flow-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect BTC and ETH market data
        id: collect
        continue-on-error: true
        run: python market_flow_collector.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_flow_latest.json data/market_flow_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update BTC ETH market flow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Check collection status
        if: steps.collect.outcome == 'failure'
        run: exit 1
