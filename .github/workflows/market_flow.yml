name: BTC ETH Market Flow 15min

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: market-flow-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect BTC and ETH market data
        id: collect
        continue-on-error: true
        run: python market_flow_collector.py

      - name: Save results with concurrent commit retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_flow_latest.json data/market_flow_history.json
          if git diff --cached --quiet; then
            echo "No new market flow data"
            exit 0
          fi
          git commit -m "Update BTC ETH market flow"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict: no forced overwrite" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Spot data saved on attempt $attempt"
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "Could not persist spot data after six attempts" >&2
          exit 1

      - name: Check collection status
        if: steps.collect.outcome == 'failure'
        run: exit 1
