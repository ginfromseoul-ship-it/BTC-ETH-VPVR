name: BTC ETH V4 Prospective Buy Timing Paper Watch
# V4_8_LATE_PAIR_PATCH: 2026-10-26-01
# Preserve V4.2 monitor and append-only ledgers; late VALID same-bar observation is separately first-seen.
# Research only: no exchange keys, no orders, no live buy alerts.

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - BTC ETH Market Flow 15min
      - BTC ETH Coinalyze Derivatives
    types: [completed]
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: btc-eth-v4-prospective-paper-monitor
  cancel-in-progress: false

jobs:
  paper_observe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout verified data and immutable paper ledger
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate V4.1 time-causal buy research and V4.2 operations
        run: |
          python -m unittest -v test_v4_paper_monitor.py test_v4_ops_audit.py
      - name: Record prospective observations and due paper outcomes
        shell: bash
        run: |
          set -euo pipefail
          python v4_paper_monitor.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('data/v4_monitor/latest.json').read_text('utf8'))
          assert r['research_only'] and not r['orders_enabled'] and not r['buy_alerts_enabled']
          assert set(r['states'])=={'BTC','ETH'}
          print('V4.1 immutable paper-only observer complete')
          PY
      - name: Preserve later verified source pair without rewriting original failed snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v48_late_pair.py <<'PY'
          """Append-only prospective recovery of a newly validated existing spot bar."""
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import hashlib
          import json
          import sys

          VERSION = "v4_8_late_pair_2026-10-26_01"

          def utc(s):
              x=datetime.fromisoformat(s.replace('Z','+00:00'))
              if x.tzinfo is None: raise ValueError('naive timestamp')
              return x.astimezone(timezone.utc)

          def valid(x):
              return (x.get('state') not in ('DATA_UNAVAILABLE',None) and not x.get('missing')
                      and x.get('spot_price_observation_usable') is True
                      and isinstance(x.get('reference_close_usdt'),(int,float))
                      and x['reference_close_usdt']>0)

          def recovery(root):
              root=Path(root)
              latest=json.loads((root/'latest.json').read_text(encoding='utf8'))
              now=utc(latest['generated_utc'])
              snapshots=root/'snapshots'
              today=snapshots / f'{now.date().isoformat()}.jsonl'
              past=[]
              for day in (now.date()-timedelta(days=1),now.date()):
                  file=snapshots/f'{day.isoformat()}.jsonl'
                  if file.exists():
                      past.extend(json.loads(line) for line in file.read_text(encoding='utf8').splitlines() if line.strip())
              pending=[]
              for sym in ('BTC','ETH'):
                  candidate=latest['states'][sym]
                  if candidate.get('symbol')!=sym or not valid(candidate):
                      continue
                  seen=utc(candidate['first_seen_utc']);bar=utc(candidate['spot_bar_end_utc'])
                  if seen!=now or not (timedelta(0)<=now-bar<=timedelta(minutes=35)):
                      continue
                  previous=[x for x in past if x.get('symbol')==sym and
                            x.get('spot_bar_end_utc')==candidate['spot_bar_end_utc']]
                  if not previous or any(valid(x) for x in previous):
                      continue
                  if not any(not valid(x) and utc(x['first_seen_utc'])<seen for x in previous):
                      continue
                  event_id=hashlib.sha256((VERSION+'|'+sym+'|'+candidate['spot_bar_end_utc']).encode()).hexdigest()[:24]
                  if any(x.get('snapshot_id')==event_id for x in past):
                      continue
                  recovered=dict(candidate)
                  recovered.update({'snapshot_id':event_id,'validation_recovery_revision':VERSION,
                                    'recovered_from_snapshot_ids':[x['snapshot_id'] for x in previous
                                        if not valid(x) and utc(x['first_seen_utc'])<seen],
                                    'original_spot_bar_first_seen_utc':min(x['first_seen_utc'] for x in previous)})
                  pending.append(recovered)
              if pending:
                  today.parent.mkdir(parents=True,exist_ok=True)
                  with today.open('a',encoding='utf8') as file:
                      for item in pending:
                          file.write(json.dumps(item,ensure_ascii=False,sort_keys=True,allow_nan=False)+'\n')
              return pending

          if __name__=='__main__':
              x=recovery(sys.argv[1] if len(sys.argv)>1 else 'data/v4_monitor')
              print('V4_8_LATE_PAIR '+json.dumps({'new_validated_pair_snapshots':len(x), 'symbols':[a['symbol'] for a in x]}))
          PY
          python /tmp/v48_late_pair.py data/v4_monitor
      - name: Query actual recent source workflow executions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v4_upstream_runs
          since="$(date -u -d '27 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          for item in 'spot market_flow.yml' 'derivatives coinalyze.yml'; do
            set -- $item
            dest="/tmp/v4_upstream_runs/$1.json"
            if gh api -X GET -f "created=>=$since" -F per_page=100 \
                   --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/workflows/$2/runs" > "$dest"; then
              echo "Read recent source workflow $2"
            else
              echo 'null' > "$dest"
              echo "Source run API unavailable for $2 (not treated as zero starts)" >&2
            fi
          done
      - name: Record V4.2 freshness and scheduled-start audit
        env:
          V4_UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
        shell: bash
        run: |
          set -euo pipefail
          python v4_ops_audit.py \
            --spot-runs /tmp/v4_upstream_runs/spot.json \
            --derivatives-runs /tmp/v4_upstream_runs/derivatives.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/v4_monitor/operational_health.json').read_text('utf8'))
          assert d['research_only'] is True and d['real_money_trading_enabled'] is False
          assert set(d['assets'])=={'BTC','ETH'}
          print('Operational quality status',d['status'])
          PY
      - name: Persist append-only paper observations and run audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git add -A data/v4_monitor
            if git diff --cached --quiet; then echo 'No fresh input observation'; exit 0; fi
            git commit -m 'Record prospective V4 paper observations and V4.8 late source verification'
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'V4.8 append-only observations persisted'; exit 0
            fi
            git rebase --abort || true
            git reset --hard origin/main
            echo "Concurrent commit collision, retry $attempt by recomputing" >&2
            python v4_paper_monitor.py
            python /tmp/v48_late_pair.py data/v4_monitor
            python v4_ops_audit.py \
              --spot-runs /tmp/v4_upstream_runs/spot.json \
              --derivatives-runs /tmp/v4_upstream_runs/derivatives.json
            sleep "$((attempt*3))"
          done
          echo 'Cannot persist V4.8 append-only audit' >&2
          exit 1
