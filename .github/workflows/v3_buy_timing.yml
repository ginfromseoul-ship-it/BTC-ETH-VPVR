name: BTC ETH Buy Timing V3 Research No Orders
# V3_BUY_TIMING_VERSION: 2026-10-26-locked-01
# Runs fixed-rule diagnostic ONLY. Does not place orders or send BUY alerts.

on:
  workflow_dispatch:
  schedule:
    - cron: '47 21 * * *'  # approx 06:47 Asia/Seoul, following V2 06:23 schedule; delays possible

permissions:
  contents: write
  actions: read

concurrency:
  group: btc-eth-v3-buy-timing-research
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out research code and data manifests
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get latest verified V2 warehouse artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v3_warehouse
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/warehouse_v2.yml/runs?status=success&per_page=25" --jq '.workflow_runs[].id' > /tmp/warehouse_runs.txt
          test -s /tmp/warehouse_runs.txt || { echo 'V2 warehouse unavailable' >&2; exit 1; }
          ok=0
          while read -r run; do
            rm -f /tmp/v3_warehouse/btc_eth_market_v2.sqlite
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n btc-eth-market-research-v2 -D /tmp/v3_warehouse; then
              if test -s /tmp/v3_warehouse/btc_eth_market_v2.sqlite; then
                echo "$run" > /tmp/v3_warehouse_run_id.txt
                echo "V3 input warehouse run $run"
                ok=1
                break
              fi
            fi
          done < /tmp/warehouse_runs.txt
          test "$ok" -eq 1 || { echo 'All successful artifacts expired or empty; run warehouse_v2.yml' >&2; exit 1; }
          sha256sum /tmp/v3_warehouse/btc_eth_market_v2.sqlite
      - name: Validate locked V3 research rules
        shell: bash
        run: python -m unittest -v test_v3_buy_timing.py
      - name: Run V3 timing hypotheses on V2 warehouse
        shell: bash
        run: |
          set -euo pipefail
          python v3_buy_timing.py \
            --db /tmp/v3_warehouse/btc_eth_market_v2.sqlite \
            --out data/v3_research \
            --warehouse-run "$(cat /tmp/v3_warehouse_run_id.txt)"
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('data/v3_research/v3_buy_timing_report.json')
          report=json.loads(path.read_text('utf8'))
          assert report['research_status']=='EXPLORATORY_REUSED_24M_DATA_NOT_FRESH_OUT_OF_SAMPLE'
          assert report['capital_deployment_authorized'] is False
          assert report['live_buy_signal_available'] is False
          for sym in ('BTC','ETH'):
              assert report['by_symbol'][sym]['shock_anchors_total'] > 0
          print('V3 locked research report validated; orders disabled')
          PY
      - name: Upload V3 audit and per-event trades
        uses: actions/upload-artifact@v4
        with:
          name: btc-eth-buy-timing-v3-research
          path: |
            data/v3_research/v3_buy_timing_report.json
            data/v3_research/v3_buy_timing_events.csv
          retention-days: 30
          if-no-files-found: error
      - name: Save versioned V3 summary to repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v3_research/v3_buy_timing_report.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Update locked V3 buy timing research summary (no trading)'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo 'Research summary saved'; exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt*3))"
          done
          echo 'Failed to persist V3 research report' >&2
          exit 1
