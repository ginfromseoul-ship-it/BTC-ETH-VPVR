name: BTC ETH Automatic Recovery

on:
  workflow_dispatch:
    inputs:
      execute_recovery:
        description: 'Actually launch repair workflows? Leave OFF for safe diagnostic test.'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '18 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: btc-eth-recovery-manager
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: main
      # Manually triggered runs are diagnostics by default.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.execute_recovery && 'true' || 'false' }}
    steps:
      - name: Check out latest repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check and recover stale market data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          NOW = datetime.now(timezone.utc)
          BASE = f"https://api.github.com/repos/{os.environ['REPO']}"
          TOKEN = os.environ['GH_TOKEN']
          DRY_RUN = os.environ.get('DRY_RUN','false').lower() == 'true'
          BRANCH = os.environ.get('BRANCH','main')

          def age_minutes(iso):
              dt = datetime.fromisoformat(iso.replace('Z', '+00:00'))
              if dt.tzinfo is None:
                  raise ValueError('timestamp has no timezone')
              return (NOW - dt.astimezone(timezone.utc)).total_seconds() / 60

          def fetch_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8')), None
              except (FileNotFoundError, ValueError, OSError) as exc:
                  return None, f'{type(exc).__name__}: {str(exc)[:100]}'

          def recent_enough(ts, limit_min):
              try:
                  age = age_minutes(ts)
                  return (-10 <= age <= limit_min), f'last data age={age:.1f} minutes'
              except (TypeError, ValueError, AttributeError) as exc:
                  return False, f'time unavailable: {exc}'

          def check_spot():
              data, err = fetch_json('data/market_flow_latest.json')
              if err:
                  return [err]
              bad=[]
              ok, msg = recent_enough(data.get('collected_utc'), 90)
              if not ok: bad.append(msg)
              for sym in ('BTCUSDT','ETHUSDT'):
                  item = data.get('assets',{}).get(sym,{})
                  if item.get('quality',{}).get('spot_flow') != 'ok':
                      bad.append(f'{sym}: spot flow unavailable')
                  flow = item.get('spot',{}).get('flow',{})
                  for w in ('1h','4h','24h'):
                      if flow.get('windows',{}).get(w,{}).get('status') != 'ok':
                          bad.append(f'{sym}: {w} spot data missing')
                  candle_ok, _ = recent_enough(flow.get('last_closed_bar_utc'), 90)
                  if not candle_ok: bad.append(f'{sym}: last closed bar stale')
              return bad

          def check_coinalyze():
              data, err = fetch_json('data/coinalyze_derivatives_latest.json')
              if err: return [err]
              bad=[]
              ok, msg = recent_enough(data.get('generated_utc'), 90)
              if not ok: bad.append(msg)
              for sym in ('BTC','ETH'):
                  item=data.get('assets',{}).get(sym,{})
                  for field in ('open_interest','futures_flow','liquidations','funding'):
                      if item.get('quality',{}).get(field) != 'ok':
                          bad.append(f'{sym}: {field} unavailable')
                  for field in ('futures_flow','liquidations'):
                      for w in ('1h','4h','24h'):
                          if item.get(field,{}).get('windows',{}).get(w,{}).get('status') != 'ok':
                              bad.append(f'{sym}: {field}.{w} missing')
                  for w in ('1h','4h','24h'):
                      if item.get('open_interest',{}).get('changes',{}).get(w,{}).get('status') != 'ok':
                          bad.append(f'{sym}: open_interest.{w} missing')
              return bad

          def check_vpvr():
              data, err = fetch_json('data/volume_profile_summary.json')
              if err: return [err]
              bad=[]
              ok, msg = recent_enough(data.get('generated_utc'), 30*60)
              if not ok: bad.append('VPVR: '+msg)
              ok, msg = recent_enough(data.get('data_end_utc_exclusive'), 96*60)
              if not ok: bad.append('VPVR underlying archive: '+msg)
              for sym in ('BTCUSDT','ETHUSDT'):
                  for period in ('30d','26w','52w'):
                      p=data.get('profiles',{}).get(f'{sym}_{period}',{})
                      try:
                          complete = (float(p.get('coverage',0)) >= .99 and
                                      int(p.get('number_of_5m_bars',0)) > 0 and
                                      float(p.get('most_traded_price_POC_usd',0)) > 0)
                      except (TypeError,ValueError): complete=False
                      if not complete: bad.append(f'{sym} {period}: incomplete profile')
              return bad

          def api(method, suffix, body=None):
              payload = None if body is None else json.dumps(body).encode('utf-8')
              headers={'Accept':'application/vnd.github+json',
                       'Authorization':f'Bearer {TOKEN}',
                       'X-GitHub-Api-Version':'2022-11-28',
                       'User-Agent':'btc-eth-recovery-watch'}
              if payload is not None: headers['Content-Type']='application/json'
              req=Request(BASE+suffix,data=payload,headers=headers,method=method)
              try:
                  with urlopen(req,timeout=20) as resp:
                      raw=resp.read()
                      return json.loads(raw) if raw else {}
              except HTTPError as exc:
                  raise RuntimeError(f'GitHub {method} HTTP {exc.code} at {suffix}') from exc

          # Hourly spot/derivative restarts are supplementary to the native 15m schedules.
          # Do not flood GitHub if upstream is geo-blocked or repeatedly down.
          TARGETS=(
              ('Spot market flow','market_flow.yml',check_spot,120),
              ('Coinalyze derivatives','coinalyze.yml',check_coinalyze,120),
              ('Binance VPVR','daily.yml',check_vpvr,360),
          )
          notes=[]
          api_errors=[]
          for name, filename, checker, cooldown in TARGETS:
              problems=checker()
              if not problems:
                  notes.append((name,'HEALTHY','latest files pass core checks'))
                  continue
              reason='; '.join(problems[:7])
              print(f'UNHEALTHY {name}: {reason}',flush=True)
              if DRY_RUN:
                  notes.append((name,'DRY RUN (would assess restart)',reason))
                  continue
              try:
                  # Search ONLY recovery/manual dispatches: scheduled runs do not
                  # inadvertently suppress attempts to recover broken schedules.
                  query=urlencode({'event':'workflow_dispatch','branch':BRANCH,'per_page':10})
                  runs=api('GET',f'/actions/workflows/{filename}/runs?{query}').get('workflow_runs',[])
                  recently_dispatched=any(
                      -10 <= age_minutes(run['created_at']) < cooldown
                      for run in runs
                  )
                  if recently_dispatched:
                      notes.append((name,'SKIPPED (cooldown)',f'{cooldown}min cooldown; '+reason))
                      continue
                  # Do not queue a recovery job when the normal job is already running.
                  query_all=urlencode({'branch':BRANCH,'per_page':10})
                  all_runs=api('GET',f'/actions/workflows/{filename}/runs?{query_all}').get('workflow_runs',[])
                  if any(run.get('status') in ('queued','in_progress','pending','waiting','requested') for run in all_runs):
                      notes.append((name,'SKIPPED (job active)',reason))
                      continue
                  api('POST',f'/actions/workflows/{filename}/dispatches',{'ref':BRANCH})
                  notes.append((name,'DISPATCHED RESTART',reason))
              except (RuntimeError,ValueError,KeyError,OSError) as exc:
                  notes.append((name,'ERROR',f'{type(exc).__name__}: {exc}'))
                  api_errors.append(name)

          lines=[f'### BTC ETH Recovery audit at {NOW.isoformat()} (UTC)',
                 f'Mode: {"DRY RUN" if DRY_RUN else "automatic"}',
                 '', '| Collector | Action | Reason |','|---|---|---|']
          for name,action,reason in notes:
              lines.append(f'| {name} | {action} | {reason.replace("|", "/")} |')
              print(f'{name}: {action} - {reason}',flush=True)
          summary='\n'.join(lines)+'\n'
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
                  f.write(summary)
          if api_errors:
              print('GitHub dispatch API error(s): '+', '.join(api_errors),file=sys.stderr)
              sys.exit(1)
          PY
