
name: BTC ETH Coinalyze Derivatives

on:
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write

concurrency:
  group: coinalyze-derivatives
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect futures data
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python coinalyze_collector.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coinalyze_derivatives_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update futures derivatives data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
