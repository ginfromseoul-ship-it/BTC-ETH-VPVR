name: BTC ETH Coinalyze Derivatives

on:
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'

permissions:
  contents: write

concurrency:
  group: coinalyze-derivatives
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect futures data
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: python coinalyze_collector.py

      - name: Save results with concurrent commit retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coinalyze_derivatives_latest.json
          if git diff --cached --quiet; then
            echo "No changed derivatives data"
            exit 0
          fi
          git commit -m "Update futures derivatives data"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict: source data preserved, no forced push" >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Derivatives saved on attempt $attempt"
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          echo "Could not persist derivatives after six attempts" >&2
          exit 1
